custom_data:
  tbprofiler:
    file_format: 'tsv'
    section_name: 'TB-Profiler Results'
    description: 'Lineage and drug-resistance calls from TB-Profiler v6.x'
    plot_type: 'table'
  vsnp_summary:
    file_format: 'tsv'
    section_name: 'vSNP Group Assignment'
    description: 'M. bovis phylogenetic group assignment from vSNP2'
    plot_type: 'table'
  sistr2:
    file_format: 'tsv'
    section_name: 'SISTR2 Results'
    description: 'Salmonella serovar prediction from SISTR2'
    plot_type: 'table'
  amrfinder:
    file_format: 'tsv'
    section_name: 'AMRFinderPlus Results'
    description: 'AMR gene detection summary from AMRFinderPlus'
    plot_type: 'table'
  retention_summary:
    file_format: 'tsv'
    section_name: 'Read & Base Retention'
    description: 'Read and base retention percentages from Raw to Trimmed'
    plot_type: 'table'
  retention_image_read:
    section_name: 'Read Retention Plot'
    description: 'Bar chart of read retention per sample'
    plot_type: 'image'
  retention_image_base:
    section_name: 'Base Retention Plot'
    description: 'Bar chart of base retention per sample'
    plot_type: 'image'
  busco_summary:
    file_format: 'tsv'
    section_name: 'BUSCO Completeness'
    description: 'Genome completeness assessment'
    plot_type: 'table'
  mlst_summary:
    file_format: 'tsv'
    section_name: 'MLST Results'
    description: 'Multilocus sequence typing results'
    plot_type: 'table'
  virulencefinder_summary:
    file_format: 'tsv'
    section_name: 'VirulenceFinder Results'
    description: 'Virulence gene detection summary'
    plot_type: 'table'
  checkpoint_summary:
    file_format: 'tsv'
    section_name: 'Sample Checkpoints'
    description: 'Pass/Fail status at 95% basecalled, 85% QC, 80% assembly thresholds'
    plot_type: 'table'
  checkpoint_image:
    section_name: 'Checkpoint Plot'
    description: 'Bar chart of retention at each checkpoint'
    plot_type: 'image'
  assembly_metrics_summary:
    file_format: 'tsv'
    section_name: 'Assembly Metrics'
    description: 'N50, total length, and retention percentages per sample'
    plot_type: 'table'
  n50_plot:
    section_name: 'N50 Bar Chart'
    description: 'Assembly N50 continuity metric per sample'
    plot_type: 'image'
  sankey_plot:
    section_name: 'Read Flow Sankey'
    description: 'Flow of reads from Raw → Trimmed → Assembly'
    plot_type: 'image'
  readlen_hist:
    section_name: 'Read Length Histograms'
    description: 'Per-sample read length distribution before and after trimming'
    plot_type: 'image'

sp:
  tbprofiler:
    fn: 'tbprofiler_summary.tsv'
  vsnp_summary:
    fn: 'vsnp_summary.tsv'
  sistr2:
